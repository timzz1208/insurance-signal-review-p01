<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:'Noto Sans CJK TC',sans-serif}
.l{position:absolute;opacity:0}
:root{--navy:rgba(22,33,62,.9);--amb:#E8B44A}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
/* flashback */
#fb{left:0;width:1080px;top:820px;text-align:center}
#fb .t{display:inline-block;padding:18px 44px;border-radius:16px;background:rgba(0,0,0,.55);color:#fff;font-size:76px;font-weight:900;letter-spacing:10px}
#fb .s{margin-top:18px;color:#ddd;font-size:36px;letter-spacing:6px}
/* faucet highlight */
#ring{width:300px;height:300px;border-radius:50%;border:8px solid var(--amb);box-shadow:0 0 30px rgba(232,180,74,.8)}
#ringlab{padding:12px 28px;border-radius:999px;background:var(--navy);color:#fff;font-size:44px;font-weight:700;white-space:nowrap}
/* consequence lower-thirds */
.lt{left:60px;top:1280px;display:flex;align-items:center;gap:20px;padding:16px 34px 16px 18px;border-radius:999px;background:var(--navy);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.lt .n{width:64px;height:64px;border-radius:50%;background:var(--amb);color:#16213E;font-weight:900;font-size:40px;display:flex;align-items:center;justify-content:center}
.lt .x{color:#fff;font-size:46px;font-weight:700;white-space:nowrap}
/* stamp */
#stamp{left:600px;top:560px;padding:14px 40px;border:10px solid #D9463B;border-radius:18px;color:#D9463B;font-size:96px;font-weight:900;letter-spacing:10px;background:rgba(255,255,255,.18);transform-origin:center}
/* floor transition label */
#down{left:0;width:1080px;top:880px;text-align:center}
#down span{display:inline-block;padding:14px 40px;border-radius:999px;background:var(--navy);color:#fff;font-size:52px;font-weight:900;letter-spacing:6px}
/* recap */
#recap{left:60px;top:980px;width:960px;padding:30px 40px;border-radius:32px;background:var(--navy);box-shadow:0 18px 50px rgba(0,0,0,.4)}
#recap .h{color:#fff;font-size:50px;font-weight:900}
#recap .h b{color:var(--amb)}
#recap .r{display:flex;align-items:center;gap:18px;margin-top:16px;opacity:0}
#recap .r .n{width:50px;height:50px;border-radius:50%;background:var(--amb);color:#16213E;font-weight:900;font-size:32px;display:flex;align-items:center;justify-content:center}
#recap .r .x{color:#fff;font-size:40px;font-weight:500}
/* bumper */
#bump{left:0;top:0;width:1080px;height:1920px;background:#16213E;display:flex;flex-direction:column;align-items:center;justify-content:center}
#bump .t{color:#fff;font-size:110px;font-weight:900;letter-spacing:12px}
#bump .bar{width:180px;height:10px;border-radius:5px;background:var(--amb);margin-top:28px}
#bump .s{color:#C9D3EA;font-size:40px;margin-top:24px;letter-spacing:6px}
/* end cards */
#main{left:90px;top:170px;width:900px;padding:28px 40px;border-radius:28px;background:rgba(22,33,62,.88);box-shadow:0 18px 50px rgba(0,0,0,.3)}
#main .k{font-size:34px;color:#C9D3EA;letter-spacing:4px;font-weight:500}
#main .t{font-size:78px;color:#fff;font-weight:900;letter-spacing:4px;margin-top:4px}
#main .bar{height:6px;width:140px;border-radius:3px;background:var(--amb);margin-top:16px;transform-origin:left}
#sub{font-size:36px;color:#fff;font-weight:500;overflow:hidden;max-height:0;opacity:0}
#disc{left:120px;width:840px;top:1540px;padding:16px 24px;border-radius:20px;background:rgba(22,33,62,.78);text-align:center;font-size:34px;color:#fff;font-weight:500;line-height:1.5}
/* notification */
#notif{left:250px;top:1150px;width:780px;padding:30px 36px;border-radius:40px;background:rgba(245,245,247,.95);box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;gap:26px;align-items:flex-start}
#notif .ic{width:84px;height:84px;border-radius:22px;background:#3C8D5A;flex:none}
#notif .hd{display:flex;justify-content:space-between;font-size:34px;color:#6b6b70}
#notif .who{font-size:40px;font-weight:700;color:#111;margin-top:6px}
#notif .msg{font-size:44px;color:#111;margin-top:8px}
</style></head><body>
<div id="fb" class="l"><div class="t">30 分鐘前</div><div class="s">退房前</div></div>
<div id="ring" class="l"></div><div id="ringlab" class="l">水龍頭還開著</div>
<div id="down" class="l"><span>↓ 樓下</span></div>
<div id="stamp" class="l">停用</div>
<div id="notif" class="l"><div class="ic"></div><div style="flex:1"><div class="hd"><span>訊息</span><span>現在</span></div><div class="who">旅行團群組</div><div class="msg">我們先出發，你處理好再來。</div></div></div>
<div id="recap" class="l"><div class="h">一個沒關的水龍頭，<b>換來</b></div></div>
<div id="bump" class="l"><div class="t">球球解說</div><div class="bar"></div><div class="s">什麼是第三人責任？</div></div>
<div id="main" class="l"><div class="k">球球解說</div><div class="t">第三人責任保障</div><div class="bar"></div><div id="sub">承保範圍、限額、除外責任，以實際保單為準</div></div>
<div id="disc" class="l">示意案例，實際承保範圍、限額及除外責任<br>依保單條款為準。</div>
<div id="flash"></div>
<script>
const C=window.OV, cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), e3=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.6,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const $=id=>document.getElementById(id);
const ITEMS=['水越過房門','樓下天花板滲水','地板拆開、除濕乾燥','樓下房間停用','旅行團先走了'];
ITEMS.forEach((x,i)=>{const r=document.createElement('div');r.className='r';r.innerHTML=`<div class="n">${i+1}</div><div class="x">${x}</div>`;$('recap').appendChild(r)});
C.lts.forEach((l,i)=>{const d=document.createElement('div');d.className='l lt';d.id='lt'+i;d.innerHTML=`<div class="n">${l.n}</div><div class="x">${l.text}</div>`;document.body.insertBefore(d,$('flash'))});
function fade(e,t,a,b,din=.35,dout=.3,dx=0,dy=0){if(t<a||t>b+dout){e.style.opacity=0;return -1}
  const qi=e3(cl((t-a)/din)),qo=cl((t-b)/dout);e.style.opacity=qi*(1-qo);e.style.transform=`translate(${(1-qi)*dx}px,${(1-qi)*dy}px)`;return qi}
window.render=t=>{
  // flashback title on freeze
  {const e=$('fb'),q=fade(e,t,C.fb[0]+.08,C.fb[1],.25,.15,0,20);}
  $('flash').style.opacity=(t>=C.fb[0]&&t<C.fb[0]+.12)?.7*(1-(t-C.fb[0])/.12):(t>=C.fb[1]&&t<C.fb[1]+.1?.5*(1-(t-C.fb[1])/.1):0);
  // faucet ring
  {const r=$('ring');r.style.left=(C.ring.x-150)+'px';r.style.top=(C.ring.y-150)+'px';const q=fade(r,t,C.ring.t[0],C.ring.t[1],.3,.2);
   if(q>=0)r.style.transform=`scale(${1.4-.4*e3(cl((t-C.ring.t[0])/.35))})`;
   const lb=$('ringlab');lb.style.left=(C.ring.x-160)+'px';lb.style.top=(C.ring.y+175)+'px';fade(lb,t,C.ring.t[0]+.2,C.ring.t[1],.3,.2,0,15);}
  fade($('down'),t,C.down[0],C.down[1],.12,.2,0,-60);
  C.lts.forEach((l,i)=>fade($('lt'+i),t,l.t[0],l.t[1],.35,.25,-60,0));
  {const s=$('stamp');if(t<C.stamp[0]||t>C.stamp[1]+.25)s.style.opacity=0;else{const x=t-C.stamp[0],q=cl(x/.16);
    s.style.opacity=Math.min(q,1-cl((t-C.stamp[1])/.25));s.style.transform=`rotate(-10deg) scale(${2.2-1.2*e3(q)})`;}}
  fade($('notif'),t,C.notif[0],C.notif[1],.4,.3,0,-50);
  {const r=$('recap');fade(r,t,C.recap[0],C.recap[1],.35,.3,0,30);
   [...r.querySelectorAll('.r')].forEach((x,i)=>{const s=C.recap[0]+.35+i*.28,q=e3(cl((t-s)/.25));x.style.opacity=q;x.style.transform=`translateX(${(1-q)*-40}px)`});}
  {const b=$('bump'),[a,e]=C.bump;if(t<a||t>e){b.style.opacity=0}else{b.style.opacity=1;const i=e3(cl((t-a)/.22)),o=e3(cl((t-(e-.22))/.22));
    b.style.transform=`translateX(${(1-i)*-1080+o*1080}px)`;}}
  {const m=$('main');const q=fade(m,t,C.main,C.end+1,.6,.01,0,26);if(q>=0)m.querySelector('.bar').style.transform=`scaleX(${e3(cl((t-C.main-.3)/.5))})`;
   const sb=$('sub'),qs=e3(cl((t-C.sub)/.5));sb.style.maxHeight=(qs*70)+'px';sb.style.marginTop=(qs*16)+'px';sb.style.opacity=qs;}
  fade($('disc'),t,C.disc,C.end+1,.6,.01);
};
</script></body></html>
