<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
  *{box-sizing:border-box}
  body{font-family:'Noto Sans CJK TC',sans-serif;-webkit-font-smoothing:antialiased}
  .layer{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0}
  .ch{display:inline-block;will-change:transform}
  .row{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap}
  .shadow{text-shadow:0 6px 24px rgba(0,0,0,.55),0 2px 0 rgba(0,0,0,.35)}
  .yel{color:#FFD60A}
  /* hook */
  #hook .tag{position:absolute;left:50%;top:205px;transform:translateX(-50%);padding:10px 26px;border-radius:999px;
    background:rgba(15,15,18,.78);color:#fff;font-weight:700;font-size:34px;letter-spacing:4px;border:2px solid rgba(255,214,10,.85)}
  #hook .l1wrap{position:absolute;left:50%;top:300px;transform:translateX(-50%);padding:6px 30px}
  #hook .bar{position:absolute;inset:0;background:#FFD60A;border-radius:18px;transform-origin:left center}
  #hook .l1{position:relative;color:#111;font-weight:900;font-size:86px;letter-spacing:2px;white-space:nowrap}
  #hook .l2{top:440px;font-weight:900;font-size:104px;color:#fff;letter-spacing:4px}
  /* nope */
  #nope .t{top:300px;font-weight:900;font-size:176px;color:#fff;letter-spacing:6px}
  #nope .ul{position:absolute;left:190px;top:520px;width:700px;height:22px;border-radius:11px;background:#FF3B30;transform-origin:left center}
  /* blur */
  #blur .a{top:250px;font-weight:900;font-size:150px}
  #blur .b{top:430px;font-weight:900;font-size:132px;color:#fff;letter-spacing:8px}
  /* question chips */
  .chip{position:absolute;padding:16px 40px;border-radius:28px;font-weight:900;font-size:96px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
  #qs .c1{left:150px;top:270px;background:#FFD60A;color:#111}
  #qs .c2{left:560px;top:450px;background:#fff;color:#111}
  /* strike */
  #strike .lab{position:absolute;left:50%;top:235px;transform:translateX(-50%);padding:8px 26px;border-radius:999px;background:#FF3B30;color:#fff;font-weight:900;font-size:40px;letter-spacing:3px}
  #strike .t{top:330px;font-weight:900;font-size:112px;color:#fff;letter-spacing:2px}
  #strike .line{position:absolute;left:110px;top:410px;width:860px;height:16px;border-radius:8px;background:#FF3B30;transform-origin:left center;box-shadow:0 4px 18px rgba(255,59,48,.6)}
  /* list */
  #list .panel{position:absolute;left:120px;top:165px;width:840px;height:470px;border-radius:40px;background:rgba(14,14,18,.80);
    border:2px solid rgba(255,255,255,.14);box-shadow:0 24px 60px rgba(0,0,0,.45);overflow:hidden}
  #list .head{position:absolute;left:56px;top:34px;font-weight:900;font-size:52px;color:#fff;letter-spacing:2px}
  #list .head .acc{position:absolute;left:0;top:78px;height:8px;width:120px;border-radius:4px;background:#FFD60A;transform-origin:left center}
  #list .item{position:absolute;left:56px;height:76px;display:flex;align-items:center;gap:26px}
  #list .num{width:64px;height:64px;border-radius:50%;background:#FFD60A;color:#111;font-weight:900;font-size:40px;display:flex;align-items:center;justify-content:center}
  #list .txt{font-weight:700;font-size:54px;color:#fff;letter-spacing:2px}

  #qs,#list{display:none}
  .scene{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0;overflow:hidden;
    background:radial-gradient(900px 700px at 80% 10%,rgba(255,214,10,.10),transparent 60%),
      repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 80px),
      repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 80px),#0E0F12}
  .sc-kick{position:absolute;left:80px;top:250px;font-weight:700;font-size:40px;color:#FFD60A;letter-spacing:4px}
  .sc-title{position:absolute;left:80px;top:310px;font-weight:900;font-size:80px;color:#fff;letter-spacing:2px;white-space:nowrap}
  .panelA{position:absolute;left:60px;top:540px;width:960px;height:700px;border-radius:36px;background:#17191E;border:2px solid rgba(255,255,255,.10)}
  .trk{position:absolute;left:30px;width:900px;height:110px}
  .trk .lb{position:absolute;left:0;top:0;width:120px;height:110px;display:flex;align-items:center;font-weight:700;font-size:38px;color:#9AA0AA}
  .trk .lane{position:absolute;left:130px;top:12px;width:770px;height:86px;border-radius:16px;background:#22252C}
  .trk .lane.empty{background:transparent;border:3px dashed rgba(255,255,255,.18)}
  .blk{position:absolute;top:8px;height:70px;border-radius:12px;background:#3B4150}
  .wv{position:absolute;bottom:43px;width:6px;border-radius:3px;background:#6E7686;transform:translateY(50%)}
  .ph{position:absolute;top:30px;width:6px;height:640px;border-radius:3px;background:#FFD60A;box-shadow:0 0 18px rgba(255,214,10,.7)}
  .q{position:absolute;padding:12px 26px;border-radius:20px;background:#FFD60A;color:#111;font-weight:900;font-size:46px;white-space:nowrap;box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .q:after{content:'';position:absolute;left:40px;bottom:-14px;border:14px solid transparent;border-bottom:0;border-top-color:#FFD60A}
  .qm{position:absolute;font-weight:900;font-size:70px;color:#FFD60A;text-shadow:0 4px 14px rgba(0,0,0,.6)}
  .card{position:absolute;left:60px;top:560px;width:960px;height:700px;border-radius:40px;background:#1A1C21;border:2px solid rgba(255,255,255,.12);box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .card .hd{position:absolute;left:44px;top:34px;display:flex;gap:14px;align-items:center;font-weight:700;font-size:34px;color:#9AA0AA}
  .dot{width:20px;height:20px;border-radius:50%;background:#3A3D45}
  .ln{position:absolute;left:44px;height:80px;display:flex;align-items:center;gap:22px;white-space:nowrap}
  .tagc{padding:6px 18px;border-radius:14px;background:#FFD60A;color:#111;font-weight:900;font-size:38px}
  .tx{font-weight:700;font-size:48px;color:#fff}
  .bad{font-weight:700;font-size:48px;color:#8A8F99}
  .caret{display:inline-block;width:5px;height:52px;background:#FFD60A;vertical-align:middle;margin-left:4px}
  .send{position:absolute;right:40px;bottom:36px;width:96px;height:96px;border-radius:50%;background:#FFD60A;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:54px;color:#111}

  #flash{position:absolute;inset:0;background:#fff;opacity:0}
  .ring{position:absolute;left:540px;top:400px;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:18px solid #FFD60A;opacity:0}
  .red{color:#FF3B30}
  #hook .l1wrap{top:330px !important;padding:10px 34px !important}
  #hook .l1{font-size:100px !important}
  #hook .l2{top:500px !important;font-size:132px !important;letter-spacing:4px !important;
    text-shadow:0 8px 30px rgba(0,0,0,.6),0 3px 0 rgba(0,0,0,.4)}
  #hook .tag{top:225px !important}

  #sE .big{position:absolute;left:0;width:1080px;text-align:center;font-weight:900;font-size:104px;color:#fff;line-height:1.25;letter-spacing:3px}
  #sE .cta{position:absolute;left:50%;top:1010px;transform:translateX(-50%);padding:22px 56px;border-radius:999px;background:#FFD60A;color:#111;font-weight:900;font-size:64px;white-space:nowrap;box-shadow:0 18px 50px rgba(255,214,10,.35)}
  #sE .arr{position:absolute;left:50%;top:1150px;width:0;height:0;margin-left:-34px;border:34px solid transparent;border-top:44px solid #FFD60A;border-bottom:0}
  #sE .foot{position:absolute;left:0;width:1080px;top:1330px;text-align:center;font-weight:500;font-size:38px;color:#9AA0AA;letter-spacing:2px}
</style></head>
<body>
<div id="hook" class="layer">
  <div class="ring" id="ring1"></div><div class="ring" id="ring2"></div>
  <div class="tag">AI 剪片實測</div>
  <div class="l1wrap"><div class="bar"></div><div class="l1">「幫我剪好看一點」</div></div>
  <div class="row l2" data-split>AI <span class="red">聽得懂</span>嗎？</div>
</div>
<div id="flash"></div>
<div id="nope" class="layer"><div class="row t shadow" data-split>通常不會</div><div class="ul"></div></div>
<div id="blur" class="layer"><div class="row a shadow yel" data-split>「好看」</div><div class="row b shadow">太模糊</div></div>
<div id="qs" class="layer"><div class="chip c1">大字卡？</div><div class="chip c2">音效？</div></div>
<div id="strike" class="layer"><div class="lab">✕ 不要這樣下指令</div><div class="row t shadow">「剪得很有質感」</div><div class="line"></div></div>
<div id="list" class="layer"><div class="panel">
  <div class="head">好的剪輯指令，要講清楚<div class="acc"></div></div>
  <div class="item" style="top:140px"><div class="num">1</div><div class="txt">主題是什麼</div></div>
  <div class="item" style="top:220px"><div class="num">2</div><div class="txt">段落怎麼分</div></div>
  <div class="item" style="top:300px"><div class="num">3</div><div class="txt">哪一句最重要</div></div>
  <div class="item" style="top:380px"><div class="num">4</div><div class="txt">效果何時出現</div></div>
</div></div>

<div id="sA" class="scene">
  <div class="sc-kick">對 AI 來說</div>
  <div class="sc-title">你的影片只是一條<span class="yel">時間軸</span></div>
  <div class="panelA">
    <div class="trk" style="top:40px"><div class="lb">畫面</div><div class="lane" id="laneV"><div class="blk" style="left:8px;width:470px"></div><div class="blk" style="left:486px;width:276px"></div></div></div>
    <div class="trk" style="top:200px"><div class="lb">口播</div><div class="lane" id="laneW"></div></div>
    <div class="trk" style="top:360px"><div class="lb">字卡</div><div class="lane empty"></div></div>
    <div class="trk" style="top:520px"><div class="lb">音效</div><div class="lane empty"></div></div>
    <div class="ph" id="ph"></div>
  </div>
  <div class="q" id="q1" style="left:230px;top:660px">強調哪一句？</div>
  <div class="qm" id="m1a" style="left:330px;top:770px">?</div><div class="qm" id="m1b" style="left:600px;top:760px">?</div><div class="qm" id="m1c" style="left:840px;top:775px">?</div>
  <div class="q" id="q2" style="left:470px;top:500px">哪裡換畫面？</div>
  <div class="q" id="q3" style="left:300px;top:858px">大字卡？</div>
  <div class="q" id="q4" style="left:560px;top:1018px">音效？</div>
</div>
<div id="sB" class="scene">
  <div class="sc-kick">好的剪輯指令</div>
  <div class="sc-title">先把<span class="yel">判斷</span>講清楚</div>
  <div class="card">
    <div class="hd"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span style="margin-left:10px">給 AI 的剪輯指令</span></div>
    <div class="ln" id="lbad" style="top:130px"><span class="bad" id="badtx"></span><span class="caret" id="cbad"></span></div>
    <div class="ln" data-i="0" style="top:130px"><span class="tagc">主題</span><span class="tx"></span></div>
    <div class="ln" data-i="1" style="top:240px"><span class="tagc">段落</span><span class="tx"></span></div>
    <div class="ln" data-i="2" style="top:350px"><span class="tagc">重點</span><span class="tx"></span></div>
    <div class="ln" data-i="3" style="top:460px"><span class="tagc">效果</span><span class="tx"></span></div>
    <div class="send" id="send">↑</div>
  </div>
</div>

<div id="sE" class="scene">
  <div class="big" id="e1" style="top:560px">你都怎麼跟 <span class="yel">AI</span></div>
  <div class="big" id="e2" style="top:700px">下剪輯指令？</div>
  <div class="cta" id="ecta">留言告訴我</div>
  <div class="arr" id="earr"></div>
  <div class="foot" id="efoot">這支影片從挑段落到字卡音效，全部由 AI 剪輯</div>
</div>
<script>
// split text nodes into per-character spans (keeps inner spans' classes)
document.querySelectorAll('[data-split]').forEach(el=>{
  const walk=n=>{[...n.childNodes].forEach(c=>{
    if(c.nodeType===3){const f=document.createDocumentFragment();
      [...c.textContent].forEach(ch=>{const s=document.createElement('span');s.className='ch';s.textContent=ch;f.appendChild(s)});
      c.replaceWith(f)} else walk(c)})};
  walk(el)});
const C=window.CARDS;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,s,d)=>cl((t-s)/d);
const out3=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.7,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const spring=x=>x<=0?0:1-Math.exp(-6.5*x)*Math.cos(11*x); // x in seconds
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function life(el,t,a,b,fin=.12,fout=.22){ // visibility envelope; returns exit progress
  const on=t>=a-0.001&&t<=b+fout;
  el.style.opacity=on?Math.min(p(t,a,fin),1-p(t,b,fout)):0; return p(t,b,fout)}
function stagger(chars,t,s,gap,fn){chars.forEach((c,i)=>fn(c,t-s-i*gap))}
window.render=function(t){
  // HOOK — slam-in opener
  {const [a,b]=C.hook, L=$('#hook'), ex=life(L,t,a,b,.01,.3);
   L.style.transform=`translateY(${-40*out3(ex)}px)`; L.style.filter=ex>0?`blur(${8*ex}px)`:'none';
   const oexp=x=>x>=1?1:1-Math.pow(2,-10*x);
   const shake=(x,amp)=>x<0?0:amp*Math.exp(-x*7)*Math.sin(x*75);
   $('#flash').style.opacity=t<.25?Math.max(0,1-t/.22)*.95:0;
   // line 1: slam from huge
   const w=$('#hook .l1wrap'), x1=t-a-.03, q1=oexp(cl(x1/.2));
   w.style.opacity=x1>=0?1:0; w.style.transform=`translateX(-50%) translate(${shake(x1-.2,14)}px,${shake(x1-.2,10)}px) scale(${3-2*q1}) rotate(${(1-q1)*-8}deg)`;
   w.style.filter=`blur(${(1-q1)*18}px)`;
   $('#hook .bar').style.transform='scaleX(1)';
   [['#ring1',a+.18,0],['#ring2',a+.92,1]].forEach(([id,st,k])=>{const r=$(id),x=t-st,q=out3(cl(x/.45));
     r.style.opacity=x>=0?(1-q)*.9:0; r.style.transform=`scale(${.3+3.2*q})`; r.style.top=k?'620px':'400px'; r.style.borderColor=k?'#FF3B30':'#FFD60A';});
   // line 2: chars punch in, with RGB-split glitch on 聽得懂
   const l2=$('#hook .l2');
   stagger($$('#hook .l2 .ch'),t,a+.75,.045,(c,x)=>{const q=oexp(cl(x/.16));c.style.opacity=x>=0?1:0;
     c.style.transform=`translateY(${(1-q)*-120}px) scale(${2.2-1.2*q})`;c.style.filter=`blur(${(1-q)*12}px)`});
   const g=t-(a+.95), gl=g>0&&g<.35;
   l2.style.transform=`translate(${shake(t-a-.95,16)}px,0)`;
   $$('#hook .l2 .red .ch').forEach((c,i)=>{c.style.textShadow=gl?`${8*Math.sin(g*90+i)}px 0 0 rgba(0,255,255,.8), ${-8*Math.sin(g*90+i)}px 0 0 rgba(255,0,80,.8)`:'0 8px 30px rgba(0,0,0,.6)'});
   const tg=$('#hook .tag'); const q=out3(p(t,a+1.4,.35)); tg.style.opacity=q; tg.style.transform=`translateX(-50%) translateY(${(1-q)*-30}px)`;}
  // NOPE
  {const [a,b]=C.nope, L=$('#nope'), ex=life(L,t,a,b,.01,.18);
   L.style.transform=`scale(${1+.12*ex})`; L.style.transformOrigin='540px 400px';
   stagger($$('#nope .ch'),t,a,.06,(c,x)=>{const s=spring(x);c.style.opacity=cl(x/.08);c.style.transform=`scale(${s}) rotate(${(1-s)*-14}deg)`});
   $('#nope .ul').style.transform=`scaleX(${out3(p(t,a+.3,.3))})`;}
  // BLUR
  {const [a,b]=C.blur, L=$('#blur'); life(L,t,a,b,.01,.25);
   stagger($$('#blur .a .ch'),t,a,.05,(c,x)=>{const s=spring(x);c.style.opacity=cl(x/.08);c.style.transform=`translateY(${(1-s)*-60}px) scale(${.5+.5*s})`});
   const bb=$('#blur .b'), x=t-(C.blurB), q=cl(x/.25);
   bb.style.opacity=q; const amp=x>0?3.5+2.5*Math.sin(x*9):0;
   bb.style.filter=`blur(${(1-q)*14+amp}px)`;
   bb.style.textShadow=`${8*Math.sin(x*7)}px 0 0 rgba(255,255,255,.35), ${-8*Math.sin(x*7)}px 0 0 rgba(255,214,10,.35), 0 6px 24px rgba(0,0,0,.55)`;
   bb.style.transform=`scale(${.9+.1*out3(q)})`;}
  // QUESTION CHIPS
  {const [a,b]=C.qs, L=$('#qs'); life(L,t,a,b,.01,.2);
   [[ '#qs .c1',C.qs1,-5],[ '#qs .c2',C.qs2,4]].forEach(([s,st,r])=>{const e=$(s),x=t-st,k=spring(x);
     e.style.opacity=cl(x/.08); e.style.transform=`scale(${k}) rotate(${r+(1-k)*-20}deg)`;});}
  // STRIKE
  {const [a,b]=C.strike, L=$('#strike'); life(L,t,a,b,.01,.2);
   const lab=$('#strike .lab'), q=back(p(t,a,.35)); lab.style.transform=`translateX(-50%) scale(${q})`;
   const tt=$('#strike .t'), q2=out3(p(t,a+.05,.3)); tt.style.opacity=q2; tt.style.transform=`translateY(${(1-q2)*30}px)`;
   const ls=C.strikeAt, lp=out3(p(t,ls,.28)); $('#strike .line').style.transform=`scaleX(${lp}) rotate(-2deg)`;
   const after=t-ls-.28; if(after>0){const sh=Math.exp(-after*8)*10*Math.sin(after*60); tt.style.transform=`translateX(${sh}px)`; tt.style.color=`rgba(255,255,255,${1-.45*cl(after/.2)})`;} else tt.style.color='#fff';}
  // LIST
  {const [a,...its]=C.list, L=$('#list'); life(L,t,a,C.end+1,.01,.2);
   const pn=$('#list .panel'), s=spring(t-a); pn.style.transform=`translateY(${(1-s)*-50}px) scale(${.94+.06*s})`; pn.style.opacity=cl((t-a)/.15);
   $('#list .acc').style.transform=`scaleX(${out3(p(t,a+.25,.35))})`;
   $$('#list .item').forEach((it,i)=>{const x=t-its[i], q=out3(cl(x/.35)), k=spring(x);
     it.style.opacity=cl(x/.12); it.style.transform=`translateX(${(1-q)*-60}px)`; it.style.filter=`blur(${(1-q)*6}px)`;
     it.querySelector('.num').style.transform=`scale(${k})`;
     const nxt=i<3?its[i+1]:1e9, active=t>=its[i]&&t<nxt;
     it.querySelector('.txt').style.color=active?'#FFD60A':'#fff';});}
};

// waveform bars
{const lw=document.getElementById('laneW');let r=7;const rnd=()=>{r=(r*16807)%2147483647;return r/2147483647};
 for(let i=0;i<92;i++){const b=document.createElement('div');b.className='wv';const gap=(i%23>19);b.style.left=(10+i*8.2)+'px';b.style.height=(gap?4:12+rnd()*58)+'px';lw.appendChild(b)}}
const BL=['這支影片在講什麼','要在哪裡切開','哪一句最重要','字卡、音效何時出現'];
const BAD='幫我剪得很有質感';
function sceneXY(el,t,a,b){ // whip in from right, out to left
  const ein=p(t,a,.3), eout=b==null?0:p(t,b,.3);
  const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
  const x=1080*(1-io(ein)) - 1080*io(eout);
  const bl=40*Math.sin(Math.PI*ein)+40*Math.sin(Math.PI*eout);
  const vis=t>=a&&(b==null||t<=b+.3);
  el.style.opacity=vis?1:0; el.style.transform=`translateX(${x}px)`; el.style.filter=bl>0.5?`blur(${bl}px)`:'none';}
function pop(el,t,st){const x=t-st,k=spring(x);el.style.opacity=cl(x/.08);el.style.transform=`scale(${k})`;el.style.transformOrigin='30% 100%'}
const _r=window.render;
window.render=function(t){_r(t);
  const A=C.sA;sceneXY($('#sA'),t,A.in,A.out);
  $('#ph').style.left=(160+760*cl((t-A.in)/(A.out-A.in)))+'px';
  pop($('#q1'),t,A.q1);['#m1a','#m1b','#m1c'].forEach((m,i)=>pop($(m),t,A.q1+.15+i*.12));
  pop($('#q2'),t,A.q2);pop($('#q3'),t,A.q3);pop($('#q4'),t,A.q4);
  const B=C.sB;sceneXY($('#sB'),t,B.in,null);
  const nDel=Math.floor(cl((t-B.del)/(B.delEnd-B.del))*BAD.length);
  $('#badtx').textContent=BAD.slice(0,BAD.length-nDel);
  $('#lbad').style.opacity=t<B.delEnd+.05?1:0;
  $('#cbad').style.opacity=(Math.floor(t*2.5)%2||t>B.del)?1:0;
  $$('#sB .ln[data-i]').forEach((ln,i)=>{const st=B.lines[i],x=t-st;ln.style.opacity=x>=0?1:0;
    const tag=ln.querySelector('.tagc'),k=spring(x);tag.style.transform=`scale(${k})`;
    const n=Math.floor(cl(x/ (BL[i].length*.055))*BL[i].length);
    const typing=x>=0&&(i==3||t<B.lines[i+1]);
    ln.querySelector('.tx').innerHTML=BL[i].slice(0,n)+(typing?'<span class="caret"></span>':'');});
  const sx=t-B.send, s=$('#send'); s.style.transform=`scale(${sx>0?1+.18*Math.exp(-sx*4)*Math.sin(sx*14):1})`;
  s.style.boxShadow=sx>0?`0 0 ${40*Math.exp(-sx*2)}px rgba(255,214,10,.9)`:'none';
};

const _r2=window.render;
window.render=function(t){_r2(t); if(!C.sE) return;
  const E=C.sE; sceneXY($('#sE'),t,E.in,null);
  [['#e1',E.in+.25],['#e2',E.in+.45]].forEach(([id,st])=>{const e=$(id),x=t-st,k=spring(x);e.style.opacity=cl(x/.1);e.style.transform=`translateY(${(1-k)*60}px)`});
  const c=$('#ecta'),x=t-(E.in+.8),k=spring(x); c.style.opacity=cl(x/.08); c.style.transform=`translateX(-50%) scale(${k})`;
  const a=$('#earr'),xa=t-(E.in+1.0); a.style.opacity=cl(xa/.15); a.style.transform=`translateY(${xa>0?12*Math.sin(xa*7):0}px)`;
  const f=$('#efoot'),xf=t-(E.in+1.1); f.style.opacity=cl(xf/.3);
};
