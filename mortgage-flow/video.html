<!doctype html>
<!-- 製作者：林彥廷（timzz1208@gmail.com）｜paper-ink-flow skill｜有問題歡迎來信 -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>房貸責任流｜家庭日報</title>
<!-- 字型：優先用本機 npm 套件（render.js 用本機伺服器開這頁，離線也能用）；Google Fonts 只是瀏覽器預覽的備援 -->
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-tc/chinese-traditional-500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-tc/chinese-traditional-600.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-tc/chinese-traditional-700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-tc/chinese-traditional-800.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-tc/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-tc/800.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-tc/chinese-traditional-900.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-tc/900.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;600;700;800&family=Noto+Serif+TC:wght@900&display=swap">
<style>
  :root { color-scheme: light; --bg: #CFCAC0; --ink: #141414; --mute: #4A4741; --verm: #A9760A; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans TC", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding-block: 12px; box-sizing: border-box; }
  canvas { height: calc(100% - 64px); max-width: calc(100vw - 32px); aspect-ratio: 9 / 16; object-fit: contain; border-radius: 8px; box-shadow: 0 10px 30px rgba(29,31,37,.25); }
  .bar { display: flex; gap: 10px; align-items: center; width: min(560px, calc(100vw - 32px)); }
  button { font: inherit; font-weight: 700; background: var(--ink); color: #E7E3DA; border: 0; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--verm); outline-offset: 2px; }
  input[type=range] { flex: 1; accent-color: var(--verm); }
  output { font-variant-numeric: tabular-nums; color: var(--mute); min-width: 4.5em; text-align: right; }
  body.render { padding: 0; display: block; }
  body.render canvas { width: 1080px; height: 1920px; max-width: none; border-radius: 0; box-shadow: none; display: block; }
  body.render .bar { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<div class="bar">
  <button id="play" type="button">暫停</button>
  <button id="restart" type="button">重播</button>
  <input id="scrub" type="range" min="0" max="56" step="0.01" value="0" aria-label="時間軸">
  <output id="time">0.0 秒</output>
</div>
<script src="engine.js"></script>
<script src="scene.js"></script>
<script>
(function () {
  'use strict';
  const DURATION = window.DURATION, renderAt = window.renderAt;
  // ---------- 預覽播放器（逐格輸出時不使用） ----------
  const params = new URLSearchParams(location.search);
  // 逐格輸出模式：不要自己先畫，等 render.js 載入字型後再呼叫 renderAt（印章會快取第一次畫的字形）
  if (params.has('render')) { document.body.classList.add('render'); return; }
  const playBtn = document.getElementById('play');
  const scrub = document.getElementById('scrub');
  const out = document.getElementById('time');
  let t = 0, playing = true, last = performance.now();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { playing = false; t = 52; }
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (playing) { t += dt; if (t >= DURATION) { t = DURATION; playing = false; } }
    renderAt(Math.min(t, DURATION - 1e-3));
    scrub.value = t.toFixed(2);
    out.textContent = t.toFixed(1) + ' 秒';
    playBtn.textContent = playing ? '暫停' : '播放';
    requestAnimationFrame(loop);
  }
  playBtn.addEventListener('click', () => { if (t >= DURATION) t = 0; playing = !playing; });
  document.getElementById('restart').addEventListener('click', () => { t = 0; playing = true; });
  scrub.addEventListener('input', () => { t = parseFloat(scrub.value); playing = false; });
  const start = () => { last = performance.now(); requestAnimationFrame(loop); };
  document.fonts ? document.fonts.ready.then(start) : start();
})();
</script>
</body>
</html>
